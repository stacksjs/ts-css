name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@main
        with:
          token: ${{ secrets.PANTRY_TOKEN }}

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Cross-compile Binaries
        run: cd packages/toolkit && bun run compile:all

      - name: Package Binaries
        run: cd packages/toolkit && bun run zip:all

      # Trusted publishing: the workflow's OIDC identity is the credential,
      # so there is nothing to decrypt and no long-lived secret to hand around.
      - name: Publish to npm
        run: pantry publish --npm --access public
        env:
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}

      - name: Create GitHub Release
        uses: home-lang/pantry/packages/action@main
        with:
          install: 'false'
          release: 'true'
          release-files: |
            packages/toolkit/bin/cssx-linux-x64.zip
            packages/toolkit/bin/cssx-linux-arm64.zip
            packages/toolkit/bin/cssx-windows-x64.zip
            packages/toolkit/bin/cssx-darwin-x64.zip
            packages/toolkit/bin/cssx-darwin-arm64.zip
          release-changelog: CHANGELOG.md
          release-token: ${{ secrets.GITHUB_TOKEN }}
